name: Publish Python source distribution
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release tag against package version
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}"
          PY
      - name: Build, inspect and install the source distribution
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check --strict dist/*.tar.gz
          python tests/check_distribution.py dist/*.tar.gz
          python -m pip install dist/*.tar.gz
          python -m pip check
          python -I -c "import os, yescape_grad; from yescape_grad.cpu.grad import _grid_response_becke; assert 'v'+yescape_grad.__version__ == os.environ['GITHUB_REF_NAME']"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
