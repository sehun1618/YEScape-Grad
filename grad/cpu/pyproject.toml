[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscf-dcdft-grad"
version = "0.1.0a0"
description = "Molecular density-corrected DFT energies and analytic gradients for PySCF"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES/*"]
authors = [{name = "Sehun"}]
dependencies = [
  "numpy>=1.24",
  "pyscf>=2.13,<2.15",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
