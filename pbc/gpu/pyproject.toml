[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu4pyscf-pbc-dcdft"
version = "0.1.0a0"
description = "GPU extension for restricted periodic density-corrected DFT"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES/*"]
authors = [{name = "Sehun"}]
dependencies = [
  "numpy>=1.24",
  "cupy",
  "pyscf>=2.13",
  "gpu4pyscf>=1.7.4",
  "pyscf-pbc-dcdft==0.1.0a0",
]

[project.optional-dependencies]
test = ["pytest>=7", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
